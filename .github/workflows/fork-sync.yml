name: Sync Fork From Upstream

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-sync-main
  cancel-in-progress: false

jobs:
  sync:
    name: Synchronize fork with upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require workflow-capable fork sync credential
        env:
          SYNC_TOKEN: ${{ secrets.OMNIROUTE_FORK_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error title=Missing fork sync credential::Configure OMNIROUTE_FORK_SYNC_TOKEN for this repository with Contents and Workflows read/write permissions."
            exit 1
          fi

      - name: Checkout fork main
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: false

      - name: Configure git identity
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          set -Eeuo pipefail
          git remote add upstream https://github.com/diegosouzapw/OmniRoute.git 2>/dev/null || \
            git remote set-url upstream https://github.com/diegosouzapw/OmniRoute.git

          for attempt in 1 2 3; do
            echo "Attempt ${attempt}: fetching upstream/main"
            if git -c http.https://github.com/.extraheader= fetch --prune --no-tags upstream main; then
              exit 0
            fi

            if [ "${attempt}" -lt 3 ]; then
              sleep_seconds=$((attempt * 5))
              echo "Fetch failed; retrying in ${sleep_seconds}s"
              sleep "${sleep_seconds}"
            fi
          done

          echo "::error::Failed to fetch upstream/main after 3 attempts"
          exit 1

      - name: Determine sync strategy
        id: strategy
        run: |
          set -Eeuo pipefail

          downstream_commits="$(git rev-list --count upstream/main..HEAD)"
          upstream_commits="$(git rev-list --count HEAD..upstream/main)"
          upstream_sha="$(git rev-parse upstream/main)"
          {
            echo "downstream-commits=${downstream_commits}"
            echo "upstream-commits=${upstream_commits}"
            echo "upstream-sha=${upstream_sha}"
          } >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "strategy=none" >> "$GITHUB_OUTPUT"
            echo "status=up-to-date" >> "$GITHUB_OUTPUT"
            echo "Fork already contains upstream/main at ${upstream_sha}."
          elif git merge-base --is-ancestor HEAD upstream/main; then
            echo "strategy=fast-forward" >> "$GITHUB_OUTPUT"
            echo "status=behind" >> "$GITHUB_OUTPUT"
            echo "Fork is behind upstream/main by ${upstream_commits} commit(s)."
          else
            echo "strategy=merge" >> "$GITHUB_OUTPUT"
            echo "status=diverged" >> "$GITHUB_OUTPUT"
            echo "Fork has ${downstream_commits} downstream-only and ${upstream_commits} upstream-only commit(s)."
          fi

      - name: Integrate and push upstream
        id: integrate
        if: steps.strategy.outputs.status != 'up-to-date'
        env:
          STRATEGY: ${{ steps.strategy.outputs.strategy }}
          UPSTREAM_SHA: ${{ steps.strategy.outputs.upstream-sha }}
          SYNC_TOKEN: ${{ secrets.OMNIROUTE_FORK_SYNC_TOKEN }}
        run: |
          set -Eeuo pipefail

          if [ "$STRATEGY" = "fast-forward" ]; then
            git merge --ff-only upstream/main
          else
            if ! git merge --no-edit upstream/main; then
              {
                echo "SYNC_RESULT=conflict"
                echo "SYNC_UPSTREAM_SHA=${UPSTREAM_SHA}"
              } >> "$GITHUB_ENV"
              echo "::error::Upstream merge has conflicts. Resolve these paths on a review branch:"
              git diff --name-only --diff-filter=U
              exit 1
            fi
          fi

          if ! git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo "::error::Integration did not contain fetched upstream SHA ${UPSTREAM_SHA}"
            exit 1
          fi

          authorization=$(printf 'x-access-token:%s' "$SYNC_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${authorization}" \
            push origin HEAD:main
          {
            echo "SYNC_RESULT=synchronized"
            echo "SYNC_UPSTREAM_SHA=${UPSTREAM_SHA}"
          } >> "$GITHUB_ENV"
          echo "Fork main now contains upstream/main at ${UPSTREAM_SHA}."

      - name: Write job summary
        if: always()
        env:
          STRATEGY: ${{ steps.strategy.outputs.strategy }}
          STATUS: ${{ steps.strategy.outputs.status }}
          DOWNSTREAM_COMMITS: ${{ steps.strategy.outputs.downstream-commits }}
          UPSTREAM_COMMITS: ${{ steps.strategy.outputs.upstream-commits }}
          UPSTREAM_SHA: ${{ steps.strategy.outputs.upstream-sha }}
        run: |
          {
            echo "## Fork Sync Summary"
            echo
            echo "**Repository:** ${GITHUB_REPOSITORY}"
            echo "**Triggered by:** ${GITHUB_EVENT_NAME}"
            echo "**Run:** [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo "**Fetched upstream SHA:** ${UPSTREAM_SHA:-unavailable}"
            echo

            if [ "${STATUS:-}" = "up-to-date" ]; then
              echo "### Status: UP TO DATE"
              echo "Fork main already contains the fetched upstream commit."
            elif [ "${SYNC_RESULT:-}" = "synchronized" ]; then
              echo "### Status: SYNCHRONIZED"
              echo "Fork main was updated and verified to contain the fetched upstream commit."
            elif [ "${SYNC_RESULT:-}" = "conflict" ]; then
              echo "### Status: CONFLICT - REVIEW REQUIRED"
              echo "No push was performed. Resolve the reported conflicts on a review branch."
            else
              echo "### Status: FAILED"
              echo "The fork was not confirmed synchronized. Review the failed step above."
            fi

            echo
            echo "**Strategy:** ${STRATEGY:-unavailable}"
            echo "**Initial status:** ${STATUS:-unavailable}"
            echo "**Downstream-only commits before sync:** ${DOWNSTREAM_COMMITS:-unavailable}"
            echo "**Upstream-only commits before sync:** ${UPSTREAM_COMMITS:-unavailable}"
          } >> "$GITHUB_STEP_SUMMARY"
